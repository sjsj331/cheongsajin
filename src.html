<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0a2f63">
<title>청사진 — 나의 인생 설계도</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230b3a78'/%3E%3Cpath d='M8 24V12l8-5 8 5v12z M8 18h16 M16 7v17' fill='none' stroke='%23e8f4ff' stroke-width='1.6'/%3E%3C/svg%3E">
<style>
:root{
  --bp:#0b3a78; --bp2:#082c5c; --bp3:#06224a; --line:#e8f4ff; --cyan:#7fdbff; --dim:rgba(232,244,255,.55);
  --hl:#ffd36b; --ok:#8ff0c4; --panel:rgba(6,30,66,.94); --bd:rgba(160,210,255,.28);
  --font:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Noto Sans CJK KR","Malgun Gothic",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Noto Sans Mono CJK KR",monospace;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bp3);color:var(--line);font-family:var(--font);-webkit-font-smoothing:antialiased}
button,input,textarea,select{font-family:inherit;color:inherit}
button{cursor:pointer}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
.topbar{position:relative;z-index:20;display:flex;align-items:center;gap:12px;height:56px;padding:0 14px;background:linear-gradient(180deg,#071f45,#08295a);border-bottom:1px solid var(--bd)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{flex:none}
.brand b{font-size:20px;letter-spacing:.06em;font-weight:800}
.brand small{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.22em;color:var(--cyan);opacity:.85;margin-top:1px}
.seg{display:flex;border:1px solid var(--bd);border-radius:9px;overflow:hidden;margin-left:auto;flex:none}
.seg button{background:transparent;border:0;padding:7px 12px;font-size:13px;color:var(--dim);font-weight:600}
.seg button.on{background:rgba(127,219,255,.16);color:#fff;box-shadow:inset 0 -2px 0 var(--cyan)}
.tb-actions{display:flex;gap:6px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--bd);background:rgba(127,219,255,.06);border-radius:9px;padding:7px 12px;font-size:13px;font-weight:600;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{background:rgba(127,219,255,.16);border-color:rgba(160,220,255,.5)}
.btn.primary{background:#e8f4ff;color:#082c5c;border-color:#e8f4ff}
.btn.primary:hover{background:#fff}
.btn.danger{border-color:rgba(255,140,140,.45);color:#ffb3b3;background:rgba(255,100,100,.06)}
.btn.ghost{background:transparent}
.btn svg{width:16px;height:16px}
.iconbtn{width:36px;height:36px;display:inline-grid;place-items:center;border:1px solid var(--bd);background:rgba(127,219,255,.06);border-radius:9px;padding:0}
.iconbtn svg{width:18px;height:18px}
#stage{position:relative;flex:1;overflow:hidden;
  background-color:var(--bp);
  background-image:
    radial-gradient(ellipse at 50% 40%,rgba(40,110,200,.35),rgba(4,24,56,.55) 75%),
    linear-gradient(rgba(200,230,255,.13) 1px,transparent 1px),
    linear-gradient(90deg,rgba(200,230,255,.13) 1px,transparent 1px),
    linear-gradient(rgba(200,230,255,.05) 1px,transparent 1px),
    linear-gradient(90deg,rgba(200,230,255,.05) 1px,transparent 1px);
  background-size:100% 100%,100px 100px,100px 100px,20px 20px,20px 20px;
  background-position:center,-1px -1px,-1px -1px,-1px -1px,-1px -1px}
#stage::after{content:"";position:absolute;inset:10px;border:1px solid rgba(232,244,255,.35);outline:1px solid rgba(232,244,255,.12);outline-offset:4px;pointer-events:none;z-index:3}
#gl{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;filter:drop-shadow(0 0 2px rgba(150,215,255,.75))}
#labels{position:absolute;inset:0;pointer-events:none;z-index:2;overflow:hidden}
.lbl{position:absolute;left:0;top:0;white-space:nowrap;will-change:transform;opacity:0;transition:opacity .5s;text-shadow:0 0 6px rgba(6,34,74,.95),0 0 2px rgba(6,34,74,1)}
.lbl.show{opacity:1}
.lbl.room{font-size:11px;font-weight:700;text-align:center;white-space:normal;width:max-content;max-width:78px;line-height:1.22;word-break:keep-all}
.lbl.room .pct{display:block;margin:1px 0 0}
.lbl.room .code{display:block;font:600 9px var(--mono);letter-spacing:.12em;color:var(--cyan);opacity:.9}
.lbl.room .pct{font:600 10px var(--mono);color:var(--cyan)}
.lbl.room.done .pct{color:var(--ok)}
.lbl.room.sel{color:var(--hl)}
.lbl.room.sel .code,.lbl.room.sel .pct{color:var(--hl)}
.lbl.level{font-size:12px;font-weight:700;display:flex;align-items:center;gap:6px}
.lbl.level i{font:700 11px var(--mono);font-style:normal;border:1px solid var(--line);padding:1px 5px;border-radius:3px;background:rgba(6,34,74,.6)}
.lbl.level em{font:500 10px var(--mono);font-style:normal;color:var(--dim)}
.lbl.value{font-size:12px;font-weight:700;color:#fff;text-align:center}
.lbl.value small{display:block;font:600 8.5px var(--mono);letter-spacing:.14em;color:var(--cyan)}
.lbl.habit{font-size:10.5px;color:var(--dim)}
.lbl.habit b{font:700 9.5px var(--mono);color:var(--cyan);margin-right:3px}
.lbl.roof{font-size:13px;font-weight:800;text-align:center;color:#fff}
.lbl.roof small{display:block;font:600 9px var(--mono);letter-spacing:.2em;color:var(--hl)}
.lbl.dim{font:600 10.5px var(--mono);color:var(--line);background:rgba(8,44,92,.85);padding:1px 6px;border-radius:2px}
#plan{position:absolute;inset:0;overflow:auto;display:none;padding:22px 22px 120px;-webkit-overflow-scrolling:touch}
#plan svg{display:block;width:100%;height:auto;max-width:1400px;margin:0 auto}
#plan .room{cursor:pointer}
#plan .room:hover rect.rbg{fill:rgba(127,219,255,.12)}
body.view-plan #plan{display:block}
body.view-plan #gl,body.view-plan #labels,body.view-plan .legend,body.view-plan .titleblock{display:none}
.titleblock{transition:opacity .25s;position:absolute;right:22px;bottom:22px;z-index:4;width:300px;border:1.5px solid var(--line);background:rgba(8,40,86,.82);backdrop-filter:blur(3px);font-size:12px;display:grid;grid-template-columns:62px 1fr 52px 1fr}
.titleblock>div{border-right:1px solid rgba(232,244,255,.5);border-bottom:1px solid rgba(232,244,255,.5);padding:5px 7px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.titleblock .k{font:600 9.5px var(--mono);color:var(--cyan);letter-spacing:.06em;display:flex;align-items:center}
.titleblock .v{font-weight:700}
.titleblock .wide{grid-column:span 3}
.titleblock .head{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;font:700 10px var(--mono);letter-spacing:.2em;background:rgba(232,244,255,.08)}
.titleblock .prog{grid-column:1/-1;border-bottom:0;display:flex;align-items:center;gap:8px}
.bar{flex:1;height:6px;border:1px solid var(--line);position:relative;background:repeating-linear-gradient(45deg,transparent 0 3px,rgba(232,244,255,.1) 3px 4px)}
.bar>span{position:absolute;inset:0 auto 0 0;background:var(--cyan);transition:width .6s}
.legend{position:absolute;left:22px;bottom:22px;z-index:4;font-size:11.5px;border:1px solid var(--bd);background:rgba(8,40,86,.75);padding:9px 11px;line-height:1.75;color:var(--dim)}
.legend b{color:var(--line);font:700 10px var(--mono);letter-spacing:.18em;display:block;margin-bottom:2px}
.legend i{display:inline-block;width:18px;height:10px;margin-right:7px;vertical-align:-1px;border:1px solid var(--line)}
.legend i.f{background:rgba(127,219,255,.55)}
.legend i.h{border-style:dashed;opacity:.6}
.legend i.c{width:6px;margin:0 13px 0 6px}
.legend i.s{border-color:var(--hl);background:rgba(255,211,107,.18)}
.dock{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);z-index:6;display:flex;gap:6px;padding:6px;border:1px solid var(--bd);background:rgba(6,30,66,.88);backdrop-filter:blur(6px);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.dock .btn{border-radius:10px;padding:8px 12px}
#panel{position:absolute;top:0;right:0;bottom:0;width:380px;max-width:100%;z-index:10;background:var(--panel);border-left:1px solid var(--bd);transform:translateX(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;backdrop-filter:blur(8px);box-shadow:-20px 0 40px rgba(0,0,0,.25)}
#panel.open{transform:none}
.p-head{display:flex;align-items:center;gap:8px;padding:14px 16px 10px;border-bottom:1px dashed var(--bd)}
.crumb{font:600 10.5px var(--mono);letter-spacing:.1em;color:var(--cyan);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p-body{flex:1;overflow:auto;padding:14px 16px 20px;-webkit-overflow-scrolling:touch}
.grab{display:none}
.title-input{width:100%;background:transparent;border:0;border-bottom:1px solid var(--bd);font-size:20px;font-weight:800;padding:4px 0 8px;outline:none}
.title-input:focus{border-color:var(--cyan)}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.field label,.sec-t{display:block;font:600 10px var(--mono);letter-spacing:.16em;color:var(--cyan);margin-bottom:6px;text-transform:uppercase}
.inp,select.inp,textarea.inp{width:100%;background:rgba(127,219,255,.06);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;font-size:14px;outline:none}
select.inp option{background:#0a2f63}
.inp:focus{border-color:var(--cyan);background:rgba(127,219,255,.1)}
input[type=month].inp{color-scheme:dark}
.bigpct{display:flex;align-items:baseline;gap:6px}
.bigpct b{font:800 26px var(--mono)}
.bigpct span{font-size:12px;color:var(--dim)}
.steps{list-style:none;margin:0 0 10px;padding:0}
.steps li{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px dashed rgba(160,210,255,.18)}
.chk{flex:none;width:22px;height:22px;border:1.5px solid var(--line);border-radius:5px;display:grid;place-items:center;background:transparent;padding:0}
.chk svg{width:14px;height:14px;opacity:0;transform:scale(.4);transition:.2s}
li.done .chk{background:var(--cyan);border-color:var(--cyan)}
li.done .chk svg{opacity:1;transform:none}
.steps input{flex:1;min-width:0;background:transparent;border:0;font-size:14px;outline:none;padding:3px 0}
li.done input{color:var(--dim);text-decoration:line-through}
.x{flex:none;background:transparent;border:0;color:var(--dim);font-size:18px;line-height:1;padding:2px 6px;border-radius:6px}
.x:hover{color:#ffb3b3;background:rgba(255,100,100,.1)}
.x:disabled{opacity:.25;pointer-events:none}
.addrow{display:flex;gap:6px}
.addrow .inp{flex:1}
.p-foot{display:flex;gap:8px;justify-content:space-between;padding:12px 16px calc(12px + var(--safe-b));border-top:1px dashed var(--bd)}
.hint{font-size:12px;color:var(--dim);line-height:1.6}
.sec{margin-top:18px}
.modal-wrap{position:fixed;inset:0;z-index:40;background:rgba(2,14,34,.6);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;padding:18px}
.modal-wrap.open{display:flex;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.modal{width:100%;max-width:620px;max-height:calc(100% - 10px);display:flex;flex-direction:column;background:linear-gradient(180deg,#0a2f63,#082757);border:1.5px solid var(--line);box-shadow:0 0 0 4px rgba(232,244,255,.08),0 30px 80px rgba(0,0,0,.45);position:relative}
.modal::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(200,230,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(200,230,255,.05) 1px,transparent 1px);background-size:20px 20px}
.m-head{position:relative;display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid rgba(232,244,255,.4)}
.m-head h2{margin:0;font-size:17px;flex:1}
.m-head .tag{font:600 10px var(--mono);letter-spacing:.18em;color:var(--cyan)}
.m-body{position:relative;overflow:auto;padding:16px 18px;-webkit-overflow-scrolling:touch}
.m-foot{position:relative;display:flex;gap:8px;justify-content:flex-end;align-items:center;padding:12px 18px;border-top:1px solid rgba(232,244,255,.4)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--bd);border-radius:999px;padding:5px 6px 5px 11px;font-size:13px;background:rgba(127,219,255,.07)}
.chip .x{font-size:15px;padding:0 4px}
.chip.pick{padding:8px 14px;cursor:pointer;user-select:none;font-size:14px}
.chip.pick.on{background:#e8f4ff;color:#082c5c;border-color:#e8f4ff;font-weight:700}
.stage-ed{border:1px solid var(--bd);padding:10px;margin-bottom:10px;background:rgba(6,30,66,.5)}
.stage-ed .row{display:flex;gap:6px;align-items:center}
.stage-ed .fl{font:800 12px var(--mono);border:1px solid var(--line);padding:3px 6px;flex:none}
.stage-ed .goals{margin:8px 0 0 0;padding:0 0 0 12px;border-left:1px dashed var(--bd)}
.stage-ed .goals .row{margin-bottom:5px}
.mini{font-size:13px;padding:6px 8px}
.ob-step{font:600 10.5px var(--mono);letter-spacing:.18em;color:var(--cyan);margin-bottom:6px}
.ob-q{font-size:21px;font-weight:800;margin:0 0 6px;line-height:1.4}
.ob-sub{font-size:13px;color:var(--dim);margin:0 0 16px;line-height:1.6}
.dots{display:flex;gap:6px;margin-right:auto;align-items:center}
.dots i{width:22px;height:3px;background:rgba(232,244,255,.25)}
.dots i.on{background:var(--cyan)}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--bd);background:rgba(127,219,255,.05);padding:12px 14px;margin-bottom:8px;font-size:15px;font-weight:700}
.opt small{display:block;font-weight:400;font-size:12px;color:var(--dim);margin-top:3px}
.opt.on{border-color:var(--line);background:rgba(232,244,255,.14);box-shadow:inset 3px 0 0 var(--cyan)}
.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.plancard{border:1px solid var(--bd);padding:14px;background:rgba(6,30,66,.5);display:flex;flex-direction:column;gap:6px}
.plancard.hi{border-color:var(--line);box-shadow:inset 0 3px 0 var(--cyan)}
.plancard h3{margin:0;font-size:15px}
.plancard .pr{font:800 17px var(--font)}
.plancard ul{margin:4px 0 0;padding-left:16px;font-size:12.5px;line-height:1.7;color:#d6e9ff}
.note{font-size:12px;color:var(--dim);margin-top:12px;line-height:1.6}
.menu{position:absolute;right:12px;top:52px;z-index:30;min-width:230px;background:var(--panel);border:1px solid var(--bd);box-shadow:0 20px 40px rgba(0,0,0,.35);padding:6px;display:none}
.menu.open{display:block;animation:fade .15s}
.menu button{display:flex;width:100%;gap:10px;align-items:center;text-align:left;background:transparent;border:0;padding:10px 12px;font-size:14px;border-radius:6px}
.menu button:hover{background:rgba(127,219,255,.12)}
.menu hr{border:0;border-top:1px dashed var(--bd);margin:4px 0}
.menu .mobile-only{display:none}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%) translateY(-10px);z-index:60;background:#e8f4ff;color:#082c5c;font-weight:700;font-size:14px;padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:.25s;box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:calc(100% - 30px);text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
.welcome{position:absolute;left:22px;top:22px;z-index:5;width:330px;max-width:calc(100% - 44px);border:1.5px solid var(--line);background:rgba(8,40,86,.92);backdrop-filter:blur(4px);padding:14px 16px;animation:fade .5s}
.welcome .tag{font:600 10px var(--mono);letter-spacing:.2em;color:var(--hl)}
.welcome h3{margin:6px 0 6px;font-size:16px;line-height:1.45}
.welcome p{margin:0 0 12px;font-size:12.5px;line-height:1.65;color:#cfe4ff}
.welcome .row{display:flex;gap:6px;flex-wrap:wrap}
input[type=file]{display:none}
@media (max-width:900px){
  .tb-actions .hide-md{display:none}
  .legend{display:none}
}
@media (max-width:640px){
  .topbar{height:52px;padding:0 10px;gap:8px}
  .brand b{font-size:18px}
  .brand small{font-size:8px;letter-spacing:.14em}
  .tb-actions{display:none}
  .seg button{padding:6px 9px;font-size:12px}
  .menu .mobile-only{display:flex}
  .menu hr.mobile-only{display:block}
  .menu{top:48px;right:8px}
  #stage::after{inset:6px;outline:0}
  .titleblock{right:12px;left:12px;top:12px;bottom:auto;width:auto;font-size:11px;grid-template-columns:44px 1fr 40px 1fr}
  .titleblock>div{padding:3px 6px}
  .titleblock .hm{display:none}
  .titleblock .head{font-size:9px}
  .dock{bottom:calc(14px + var(--safe-b));width:calc(100% - 24px);justify-content:space-between}
  .dock .btn{flex:1;justify-content:center;padding:9px 6px;font-size:12.5px}
  .dock .btn .t-long{display:none}
  .lbl.room{font-size:9.5px;max-width:64px}
  body.panel-open .titleblock{opacity:0;pointer-events:none}
  .lbl.room .code{display:none}
  .lbl.level{font-size:10.5px}
  .lbl.level em{display:none}
  .lbl.habit{display:none}
  .lbl.value{font-size:10.5px}
  .lbl.value small{display:none}
  .lbl.roof{font-size:11.5px}
  .lbl.dim{font-size:9px}
  #panel{top:auto;left:0;width:100%;height:68%;border-left:0;border-top:1.5px solid var(--line);transform:translateY(105%);border-radius:16px 16px 0 0}
  .grab{display:block;width:40px;height:4px;border-radius:2px;background:rgba(232,244,255,.4);margin:8px auto 0}
  .p-head{padding-top:8px}
  .welcome{left:12px;right:12px;top:auto;bottom:calc(76px + var(--safe-b));width:auto;max-width:none}
  .modal-wrap{padding:0;align-items:flex-end}
  .modal{max-height:92%;border-radius:16px 16px 0 0;border-bottom:0}
  .m-foot{padding-bottom:calc(12px + var(--safe-b))}
  .plans{grid-template-columns:1fr}
  #plan{padding:12px 10px 110px}
  .ob-q{font-size:19px}
}
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect x=".75" y=".75" width="32.5" height="32.5" fill="none" stroke="#e8f4ff" stroke-width="1.2"/><path d="M8 26V14l9-6 9 6v12M8 20h18M17 8v18M12.5 26v-6M21.5 26v-6" fill="none" stroke="#7fdbff" stroke-width="1.4"/><path d="M5 29h24" stroke="#e8f4ff" stroke-width="1" stroke-dasharray="2 2"/></svg>
      <div><b>청사진</b><small>LIFE BLUEPRINT</small></div>
    </div>
    <div class="seg" role="tablist">
      <button id="v3d" class="on">3D 입체도</button>
      <button id="vplan">2D 평면도</button>
    </div>
    <div class="tb-actions">
      <button class="btn" id="tbEdit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>도면 편집</button>
      <button class="btn hide-md" id="tbExport"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 4v11m-5-5 5 5 5-5M5 20h14"/></svg>PNG 저장</button>
      <button class="btn hide-md" id="tbNew"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>새 도면</button>
    </div>
    <button class="iconbtn" id="menuBtn" aria-label="메뉴"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>
    <div class="menu" id="menu">
      <button data-act="new" class="mobile-only">＋ 새 도면 시작</button>
      <button data-act="edit" class="mobile-only">✎ 도면 편집 (층·가치·습관)</button>
      <button data-act="export" class="mobile-only">⤓ PNG 이미지로 저장</button>
      <hr class="mobile-only">
      <button data-act="rebuild">▶ 착공 애니메이션 다시 보기</button>

  mctx.font = `${weight} ${size}px "Noto Sans KR","Noto Sans CJK KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif`;

  const push = () => { out.push(line.trim()); line = ""; };
  for (let tk of tokens) {

    if (/^\s+$/.test(tk)) { push(); continue; }
    if (line.trim()) push();

    for (const ch of tk) { if (!fits(line + ch) && line) { push(); if (out.length >= maxLines) { cut = true; break; } } line += ch; }

function drawGrid(ctx, w, h, s) {
  const g = ctx.createRadialGradient(w / 2, h * 0.4, 10, w / 2, h * 0.4, Math.max(w, h) * 0.75);
  g.addColorStop(0, "#14498f"); g.addColorStop(1, "#082a5a");
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h); ctx.lineWidth = 1;
  for (const [step, a] of [[20 * s, 0.05], [100 * s, 0.13]]) {
    ctx.strokeStyle = `rgba(200,230,255,${a})`; ctx.beginPath();
    for (let x = 0; x < w; x += step) { ctx.moveTo(x + 0.5, 0); ctx.lineTo(x + 0.5, h); }
    for (let y = 0; y < h; y += step) { ctx.moveTo(0, y + 0.5); ctx.lineTo(w, y + 0.5); }
    ctx.stroke();
  }
}

    ctx.fillStyle = "rgba(8,40,86,.94)"; ctx.fillRect(bx, by, bw, bh);
    ctx.strokeStyle = "#e8f4ff"; ctx.lineWidth = 1.5; ctx.strokeRect(bx, by, bw, bh);
    const rows = [["TITLE BLOCK · 표제란", "A-001"], ["도면명", plan.title], ["작성자", plan.author], ["날짜", today() + "    축척 1 : 인생"], ["공정률", pct(totalProgress())]];
    rows.forEach((r, i) => {
      const rh = bh / rows.length, ry = by + i * rh, cy = ry + rh / 2;
      if (i) { ctx.strokeStyle = "rgba(232,244,255,.5)"; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(bx, ry); ctx.lineTo(bx + bw, ry); ctx.stroke(); }
      ctx.textAlign = "left";
      if (i === 0) { ctx.font = `700 9.5px ${MF}`; ctx.fillStyle = "#e8f4ff"; ctx.fillText(r[0], bx + 8, cy); ctx.textAlign = "right"; ctx.fillText(r[1], bx + bw - 8, cy); return; }
      ctx.font = `600 9.5px ${MF}`; ctx.fillStyle = "#7fdbff"; ctx.fillText(r[0], bx + 8, cy);
      ctx.font = `700 12px ${FF}`; ctx.fillStyle = "#e8f4ff"; ctx.fillText(r[1], bx + 66, cy);
    });
    ctx.font = `600 10px ${MF}`; ctx.fillStyle = "rgba(232,244,255,.65)"; ctx.textAlign = "left"; ctx.fillText("청사진 · LIFE BLUEPRINT", 24, 30);
    finishExport(c, "입체도");
  } catch (err) { console.warn(err); toast("이미지 저장에 실패했어요"); }
}
function finishExport(c, kind) {
  lastExport = c;
  c.toBlob(b => { const u = URL.createObjectURL(b); download(u, fname("png")); setTimeout(() => URL.revokeObjectURL(u), 5000); toast(`${kind} PNG를 저장했어요 📐`); }, "image/png");
}
function b64d(s) { const bin = atob(s.replace(/-/g, "+").replace(/_/g, "/")); return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0))); }
async function shareLink() {
  let bin = ""; const bytes = new TextEncoder().encode(JSON.stringify(plan));
  for (let i = 0; i < bytes.length; i += 8192) bin += String.fromCharCode(...bytes.subarray(i, i + 8192));
  const url = location.href.split("#")[0] + "#p=" + btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  try { await navigator.clipboard.writeText(url); toast("공유 링크를 복사했어요 🔗"); }
  catch (e) { prompt("아래 링크를 복사하세요", url); }
}

/* ---------------- 메뉴 / 버튼 ---------------- */
const menu = $("#menu");
$("#menuBtn").onclick = e => { e.stopPropagation(); menu.classList.toggle("open"); };
document.addEventListener("click", e => { if (!menu.contains(e.target)) menu.classList.remove("open"); });
function confirmNew() { if (plan.stages.some(s => s.goals.some(g => goalProgress(g) > 0)) && !confirm("새 도면을 시작하면 지금 도면은 이 기기에서 덮어써져요.\n필요하면 먼저 PNG나 백업 파일로 저장해 두세요.\n\n계속할까요?")) return; openOnboarding(); }
menu.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return; menu.classList.remove("open");
  const a = b.dataset.act;
  if (a === "new") confirmNew();
  if (a === "edit") openEditor();
  if (a === "export") exportPNG();
  if (a === "rebuild") { setView("3d"); fillCur = {}; buildScene(true); userTouched = false; }
  if (a === "share") shareLink();
  if (a === "json") { const u = URL.createObjectURL(new Blob([JSON.stringify(plan, null, 2)], { type: "application/json" })); download(u, fname("json")); setTimeout(() => URL.revokeObjectURL(u), 5000); toast("백업 파일을 저장했어요"); }
  if (a === "import") $("#fileIn").click();
  if (a === "sample") { if (!confirm("샘플 도면(대학생 · 공기업 IT 취업)으로 바꿀까요? 지금 도면은 덮어써져요.")) return; plan = samplePlan(); fillCur = {}; selectedId = null; panel.classList.remove("open"); save(); setView("3d"); buildScene(true); fitView(true); userTouched = false; }
  if (a === "biz") openBiz();
});
$("#fileIn").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try { const p = JSON.parse(await f.text()); if (!validPlan(p)) throw 0; plan = p; fillCur = {}; selectedId = null; panel.classList.remove("open"); save(); buildScene(true); fitView(true); if (view === "plan") renderPlan(); toast("도면을 불러왔어요"); }
  catch (err) { toast("청사진 백업 파일이 아니에요"); }
  e.target.value = "";
};
$("#tbEdit").onclick = openEditor; $("#tbExport").onclick = exportPNG; $("#tbNew").onclick = confirmNew;
$("#dkAdd").onclick = () => openAddGoal(); $("#dkEdit").onclick = openEditor; $("#dkExport").onclick = exportPNG;
$("#dkView").onclick = () => { viewShiftTarget = 0; fitView(false); };

let toastT; function toast(m) { const t = $("#toast"); t.textContent = m; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 2400); }

/* ---------------- 환영 카드 ---------------- */
function showWelcome() {
  if ($("#welcome")) return;
  const w = document.createElement("div"); w.className = "welcome"; w.id = "welcome";
  w.innerHTML = `<div class="tag">SAMPLE DRAWING · 샘플 도면</div><h3>계획을 '쓰는' 대신,<br>인생을 '설계'해 보세요.</h3>
  <p>공기업 IT직을 꿈꾸는 대학생의 샘플 설계도예요. <b>기초</b>는 가치, <b>층</b>은 인생 단계, <b>방</b>은 목표, <b>기둥</b>은 습관. 방을 눌러 단계를 체크하면 그만큼 채워집니다.</p>
  <div class="row"><button class="btn primary" id="wStart">내 도면 만들기</button><button class="btn ghost" id="wLook">샘플 둘러보기</button></div>`;
  stage.appendChild(w);
  $("#wStart").onclick = () => { hideWelcome(); openOnboarding(); };
  $("#wLook").onclick = hideWelcome;
}
function hideWelcome() { const w = $("#welcome"); if (w) w.remove(); try { localStorage.setItem(WKEY, "1"); } catch (e) {} }

/* ---------------- 시작 ---------------- */
function init() {
  let fresh = false, shared = false;
  const m = location.hash.match(/#p=([\w-]+)/);
  if (m) { try { const p = JSON.parse(b64d(m[1])); if (validPlan(p)) { plan = p; shared = true; } } catch (e) {} history.replaceState(null, "", location.pathname + location.search); }
  if (!plan) { try { const p = JSON.parse(localStorage.getItem(KEY)); if (validPlan(p)) plan = p; } catch (e) {} }
  if (!plan) { plan = samplePlan(); fresh = true; }
  if (shared) save();
  resize(); buildScene(true); fitView(true);
  if (!renderer) { setView("plan"); $("#v3d").disabled = true; toast("WebGL을 쓸 수 없어 2D 평면도로 보여드려요"); }
  let welcomed = false; try { welcomed = !!localStorage.getItem(WKEY); } catch (e) {}
  if (fresh && !welcomed) setTimeout(showWelcome, 1400);
  if (shared) toast("공유받은 도면을 불러왔어요");
  requestAnimationFrame(frame);
}
let rzT; window.addEventListener("resize", () => { resize(); clearTimeout(rzT); rzT = setTimeout(() => { if (view === "plan") renderPlan(); else if (!userTouched) fitView(false); }, 150); });
init();
</script>
